[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lepotato-hmi"
version = "0.1.0"
description = "Linux hardware testing and MQTT messaging dashboard with expressive status eyes"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Cdaprod"}]
license = "MIT"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "paho-mqtt>=2,<3", "pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
lepotato-hmi = "lepotato_hmi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lepotato_hmi = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
