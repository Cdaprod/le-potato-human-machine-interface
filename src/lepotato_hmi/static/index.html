<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Potato HMI</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main>
<header><h1>LE POTATO <span>HMI</span></h1><small>DEVICE TESTING / MESSAGING / OBSERVABILITY</small></header>
<section class="top">
<article class="face"><div id="eyes"><div class="eye"><i></i></div><div class="eye"><i></i></div></div><p id="mood">Idle · Observing</p></article>
<article><h2>System</h2><pre id="status">Connecting…</pre><h2>Serial devices (read-only discovery)</h2><pre id="devices">Scanning…</pre></article>
</section>
<section class="panels">
<article><h2>Simulate test event</h2><form id="test"><input name="name" value="bench-check" aria-label="Test name"><select name="kind"><option value="test.started">Started</option><option value="test.passed">Passed</option><option value="test.failed">Failed</option></select><button>Emit</button></form></article>
<article><h2>MQTT publish</h2><form id="publish"><input name="topic" value="benchlab/demo/command" aria-label="MQTT topic"><input name="payload" value='{"hello":"world"}' aria-label="JSON payload"><button>Publish</button></form><p>Requires a connected broker. Subscribe to <code>benchlab/#</code> for messages.</p></article>
</section>
<article><h2>Recent events</h2><pre id="events">No events</pre></article>
<footer><span id="feedback"></span><a href="/docs">OpenAPI docs</a> · <a href="https://github.com/Cdaprod/le-potato-human-machine-interface">Source</a></footer>
</main><script src="/static/app.js"></script></body></html>
